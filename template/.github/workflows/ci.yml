name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      {{CI_PM_SETUP}}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: {{PM}}
      - run: {{INSTALL_CI}}
      - run: {{PM}} run lint
      {{CI_BROWSER_SETUP}}
      - run: {{PM}} test
      - run: {{PM}} run build
