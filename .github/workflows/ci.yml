name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: template/.tool-versions
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Scaffolds a project per package manager and runs what its own CI runs, so
  # a template that no longer installs, lints, tests or builds turns this red.
  # Lint warnings fail too; only npm needs `--` to pass the flag to ESLint
  # (pnpm forwards it literally).
  template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: npm
            lint-args: -- --max-warnings 0
          - pm: pnpm
            lint-args: --max-warnings 0
          - pm: yarn
            lint-args: --max-warnings 0
    steps:
      - uses: actions/checkout@v7
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version-file: template/.tool-versions
          cache: npm
      - if: matrix.pm == 'yarn'
        run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js "$RUNNER_TEMP/app" --no-git --skip-install --pm ${{ matrix.pm }}
      - working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.pm }} install
      - working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.pm }} run lint ${{ matrix.lint-args }}
      - working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.pm }} test
      - working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.pm }} run build
