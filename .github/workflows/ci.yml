name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Scaffolds a project per package manager and runs what its own CI runs
  # (scripts/smoke.ts), so a template that no longer installs, lints without
  # warnings, tests or builds turns this red. `npm run smoke` runs the same
  # check locally.
  template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: npm
          - pm: pnpm
          - pm: yarn
          - pm: npm
            flags: --browser-tests
    steps:
      - uses: actions/checkout@v7
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - if: matrix.pm == 'yarn'
        run: corepack enable
      - run: npm ci
      - run: npm run smoke -- --pm ${{ matrix.pm }} ${{ matrix.flags }}
